services:
  mysql:
    image: mysql:8.0
    container_name: fite-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_rahasia
      MYSQL_DATABASE: fite_arsip
      MYSQL_USER: fite_app
      MYSQL_PASSWORD: rahasia
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_rahasia"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
